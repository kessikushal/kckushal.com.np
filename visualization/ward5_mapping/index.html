  <style>
    body {

    .sidebar-section {

    .sidebar-section input {

    .sidebar-section p {

    .sidebar-section ul {

      margin: 0;

    }



    .zoom-to-layer-btn {

      margin-left: auto;

      flex-shrink: 0;

      width: 20px;

      padding: 0;

    a[href*="linkedin.com"] {

    .color-box {

      width: 14px;

    .color-point {

    .ward-hover-popup .maplibregl-popup-content {

      backdrop-filter: blur(2px);

    .maplibregl-ctrl-terrain .maplibregl-ctrl-icon,

    .maplibregl-ctrl-terrain::after,

    .maplibregl-ctrl-terrain-enabled::after {

      content: "3D";

    #photo-modal,

    #video-modal {

      position: fixed;

    .compare-after {

    }



    .compare-before {

    }



    .compare-img-wrap img {

      top: 0;

      left: 0;

    .compare-divider {

      top: 0;

      bottom: 0;

    .compare-label {

    #photo-modal-caption {

</head>



<body>

  <button id="sidebar-toggle" class="hidden" title="Toggle Menu">☰</button>

  <div id="sidebar"></div>

  <div id="map"></div>

  <div id="load-error"></div>



  <div id="photo-modal" role="dialog" aria-modal="true">

    <div id="photo-modal-content">

      <button id="photo-modal-close" type="button" aria-label="Close">&times;</button>

      <div id="photo-compare" class="compare-slider">

        <div class="compare-img-wrap compare-after"><img id="cmp-after" alt="" /></div>

        <div class="compare-img-wrap compare-before" id="cmp-before-wrap"><img id="cmp-before" alt="" /></div>

        <div class="compare-divider" id="cmp-divider"></div>

        <div class="compare-handle" id="cmp-handle">⇔</div>

        <span class="compare-label compare-label-before">Before</span>

        <span class="compare-label compare-label-after">After</span>

      </div>

      <div id="photo-modal-caption">

        <h3 id="photo-modal-title"></h3>

        <p id="photo-modal-meta"></p>

      </div>

    </div>

  </div>



  <div id="video-modal" role="dialog" aria-modal="true">

    <div id="video-modal-content">

      <button id="video-modal-close" type="button" aria-label="Close">&times;</button>

      <h3 id="video-modal-title"></h3>

      <div id="video-modal-preview"></div>

      <div id="video-modal-links"></div>

    </div>

  </div>



  <script>

    /* =========================================================

       Config-driven Web GIS engine. All content lives in data.json

       (layers, styles, zoom ranges, legend, popups, sidebar text).

       ========================================================= */

    const $ = (s) => document.querySelector(s);

    const EMPTY = { type: "FeatureCollection", features: [] };

    const ZOOM_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>`;



    let CFG, map, activePopup = null, fitted = false, jumpMarker = null;

    const cache = {};            // layerId -> GeoJSON (used by zoom-to-layer)

    const partToLayer = {};      // map layer id -> layer config

    const iconImages = {};       // iconId -> loaded Image

    const hoverPopups = [];



    const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // {field} = escaped value, {field|num} = formatted number

    const tpl = (s, p) => String(s).replace(/**\{**(\w+)(?:**\\|**(\w+))?**\}**/g, (_, k, f) => {

      const v = p ? p[k] : undefined;

      if (f === "num") { const n = Number(v); return Number.isFinite(n) ? n.toLocaleString() : "0"; }

      return v === undefined || v === null || v === "" ? "Not available" : esc(v);

    });

    const partId = (l, i) => `${l.id}__${i}`;

    const isOn = (id) => $(`#chk-${id}`).checked;

    const layerById = (id) => CFG.layers.find((l) => l.id === id);



    (async function boot() {

      try {

        const r = await fetch("data.json");

        if (!r.ok) throw new Error(r.status + " " + r.statusText);

        CFG = await r.json();

      } catch (e) {

        const el = $("#load-error");

        el.style.display = "block";

        el.innerHTML = "<b>Could not load data.json</b><br>" + esc(e.message) + "<br><br>Open this page through a web server (e.g. <code>python -m http.server</code>), not by double-clicking the file.";

        return;

      }

      init();

    })();



    /* ---------------- Sidebar ---------------- */

    function legendHtml(g) {

      if (!g) return "";

      if (g.type === "box") return `<span class="color-box" style="background:${g.color};${g.border ? `border:${g["border-width"] || 1}px ${g.dashed ? "dashed" : "solid"} ${g.border};` : ""}"></span>`;
      if (g.type === "line") return `<span class="color-line" style="background:${g.color}"></span>`;

      if (g.type === "point") return `<span class="color-point" style="background:${g.color}"></span>`;

      if (g.type === "icon") {
        const ic = CFG.icons[g.icon] || {};
        const src = ic.url || "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(ic.svg || "");
        const size = Number(ic.legendSize) || 18;
        return `<img class="legend-icon" src="${src}" alt="" width="${size}" height="${size}" style="width:${size}px;height:${size}px">`;
      }

      return "";

    }



    function buildSidebar() {

      const a = CFG.app;

      let h = `<div id="sidebar-header"><div id="sidebar-title">${a.logo ? `<img src="${esc(a.logo)}" alt="">` : ""}${esc(a.title)}</div><button id="sidebar-close">✕</button></div>`;



      h += `<div class="sidebar-section"><h4>🗺️ Basemap Layer</h4>${CFG.basemaps.map((b) =>

        `<label><input type="radio" name="basemap" value="${esc(b.id)}" ${b.id === a.defaultBasemap ? "checked" : ""}/>${esc(b.label)}</label>`).join("")}</div>`;



      CFG.groups.forEach((g, gi) => {

        if (gi === 0) h += `<label><input type="checkbox" id="all-layers" checked /><strong>Turn ON/OFF all Layers</strong></label>`;

        h += `<div class="sidebar-section"><h4>${esc(g.title)}</h4>`;



        g.layers.forEach((id) => {

          const l = layerById(id);

          if (!l) return console.warn("Group references unknown layer:", id);

          h += `<label><input type="checkbox" class="layer-chk" id="chk-${l.id}" ${l.visible ? "checked" : ""}/>${legendHtml(l.legend)}${esc(l.label)}` +

            (l.zoomButton === false ? "" : `<button type="button" class="zoom-to-layer-btn" data-source="${l.id}" title="Zoom to layer" aria-label="Zoom to layer">${ZOOM_SVG}</button>`) + `</label>`;

        });

        h += `</div>`;

      });



      (CFG.sections || []).forEach((s) => {
        const renderItem = (item) => {
          // Plain strings remain text. Link objects keep URLs separate from visible labels.
          if (item && typeof item === "object" && !Array.isArray(item)) {
            const label = esc(item.text ?? item.label ?? "");
            const href = String(item.href || "");
            if (/^https?:\/\//i.test(href)) {
              const target = item.target === "_blank" ? ' target="_blank" rel="noopener noreferrer"' : "";
              return `<li><a href="${esc(href)}"${target}>${label}</a></li>`;
            }
            return `<li>${label}</li>`;
          }
          return `<li>${esc(item)}</li>`;
        };
        h += `<div class="sidebar-section"><h4>${esc(s.title)}</h4>` +
          (s.type === "list"
            ? `<ul>${(Array.isArray(s.content) ? s.content : []).map(renderItem).join("")}</ul>`
            : `<p>${esc(s.content ?? "")}</p>`) + `</div>`;
      });

      $("#sidebar").innerHTML = h;

      if (a.sidebarOpen !== false) $("#sidebar").classList.add("open"); else $("#sidebar-toggle").classList.remove("hidden");

    }



    function updateMasterCheckbox() {

      const all = $("#all-layers"); if (!all) return;

      const boxes = [...document.querySelectorAll(".layer-chk")];

      const n = boxes.filter((b) => b.checked).length;

      all.checked = n === boxes.length;

      all.indeterminate = n > 0 && n < boxes.length;

    }



    function syncVisibility() {

      CFG.layers.forEach((l) => {

        const v = isOn(l.id) ? "visible" : "none";

        l.render.forEach((_, i) => { const id = partId(l, i); if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", v); });

      });

    }



    /* ---------------- Data / icons / layers ---------------- */

    async function loadData(l) {

      if (l.source.data) { cache[l.id] = l.source.data; return; }

      try {

        const r = await fetch(l.source.url);

        if (r.ok) cache[l.id] = await r.json();

        else console.warn("Could not load", l.source.url, r.status);

      } catch (e) { console.warn("Could not load", l.source.url, e); }

    }



    function loadImg(src) {

      return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error("icon load failed: " + src)); im.src = src; });

    }



    async function ensureIcons() {

      await Promise.all(Object.entries(CFG.icons || {}).map(async ([id, ic]) => {

        try {

          if (!iconImages[id]) iconImages[id] = await loadImg(ic.url || "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(ic.svg));

          if (!map.hasImage(id)) map.addImage(id, iconImages[id]);

        } catch (e) { console.warn(e.message); }

      }));

    }



    const GEOM = {

      polygon: ["Polygon", "MultiPolygon"],

      line: ["LineString", "MultiLineString"],

      point: ["Point", "MultiPoint"],

    };

    const DEFAULT_GEOM = { fill: "polygon", "fill-extrusion": "polygon", line: "line", circle: "point", symbol: "point" };



    function buildFilter(p) {

      const g = p.geometry || DEFAULT_GEOM[p.type];

      const parts = [];

      if (g && g !== "any") parts.push(["in", ["geometry-type"], ["literal", GEOM[g] || g]]);

      if (p.filter) parts.push(p.filter);

      return parts.length === 0 ? null : parts.length === 1 ? parts[0] : ["all", ...parts];

    }



    async function addAll() {

      await ensureIcons();

      CFG.layers.forEach((l) => {

        if (!map.getSource(l.id)) {

          map.addSource(l.id, { type: "geojson", data: cache[l.id] || EMPTY, ...(l.source.promoteId ? { promoteId: l.source.promoteId } : {}) });

        }

        l.render.forEach((p, i) => {

          const id = partId(l, i);

          partToLayer[id] = l;

          if (map.getLayer(id)) return;

          const layout = { ...(p.type === "symbol" ? { "icon-allow-overlap": true, "icon-ignore-placement": true } : {}), ...(p.layout || {}), visibility: isOn(l.id) ? "visible" : "none" };

          const def = { id, type: p.type, source: l.id, paint: p.paint || {}, layout };

          const f = buildFilter(p); if (f) def.filter = f;

          const minz = p.minzoom ?? l.minzoom, maxz = p.maxzoom ?? l.maxzoom;

          if (minz !== undefined) def.minzoom = minz;

          if (maxz !== undefined) def.maxzoom = maxz;

          map.addLayer(def);

        });

      });

      if (!fitted) {

        const b = getBounds(cache[CFG.app.fitLayer]);

        if (b) { map.fitBounds(b, { padding: CFG.app.fitPadding ?? 25, maxZoom: CFG.app.fitMaxZoom ?? 15, offset: [0, 10] }); fitted = true; }

      }

    }



    /* ---------------- Zoom to layer ---------------- */

    function getBounds(gj) {

      if (!gj || !Array.isArray(gj.features) || !gj.features.length) return null;

      let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;

      (function walk(co) {

        if (!Array.isArray(co)) return;

        if (typeof co[0] === "number") { a = Math.min(a, co[0]); b = Math.min(b, co[1]); c = Math.max(c, co[0]); d = Math.max(d, co[1]); return; }

        co.forEach(walk);

      })(gj.features.map((f) => f.geometry && f.geometry.coordinates));

      return Number.isFinite(a) ? [[a, b], [c, d]] : null;

    }



    function zoomToSource(id) {

      const b = getBounds(cache[id]);

      if (!b) return console.warn("Zoom to layer: no data for", id);

      const mobile = matchMedia("(max-width: 768px)").matches;

      map.fitBounds(b, {

        padding: mobile ? { top: 20, bottom: 20, left: 20, right: 20 } : { top: 10, bottom: 70, left: 380, right: 5 },

        maxZoom: mobile ? 18 : 20, duration: 1000,

      });

    }



    /* ---------------- Popups & interactions ---------------- */

    function closeTransient() {

      if (activePopup) activePopup.remove();

      hoverPopups.forEach((p) => p.remove());

    }



    function popupHtml(inter, f) {

      const p = f.properties || {};

      let rows;

      if (inter.fields) rows = inter.fields.map((x) => (typeof x === "string" ? [x, x] : [x.key, x.label || x.key])).filter(([k]) => p[k] !== undefined && p[k] !== null && p[k] !== "");

      else rows = Object.keys(p).filter((k) => p[k] !== null && p[k] !== undefined && p[k] !== "").map((k) => [k, k]);


      const title = `<div style="font-size:14px;font-weight:700;margin-bottom:6px;text-align:center;color:red;">${esc(inter.title || "Feature")}</div>`;

      if (!rows.length) return `<div style="font-size:12px">${title}No attributes available.</div>`;

      return `<div style="font-size:10px;line-height:1.1;max-width:325px">${title}${rows.map(([k, lab]) => `<div style="margin-bottom:3px"><strong>${esc(lab)}:</strong> ${esc(p[k])}</div>`).join("")}</div>`;

    }



    function runInteraction(l, f, lngLat) {

      const inter = l.interaction;

      closeTransient();

      if (inter.type === "popup") {

        const pop = new maptilersdk.Popup({ closeButton: true, closeOnClick: true }).setLngLat(lngLat).setHTML(inter.template ? tpl(inter.template, f.properties) : popupHtml(inter, f)).addTo(map);

        activePopup = pop;

        pop.on("close", () => { if (activePopup === pop) activePopup = null; });

      } else if (inter.type === "compare") (inter, f.properties || {});

      else if (inter.type === "video") openVideo(inter, f.properties || {});

    }



    function bindInteractions() {

      // topmost clickable feature wins

      map.on("click", (e) => {

        $("#sidebar").classList.remove("open"); $("#sidebar-toggle").classList.remove("hidden");

        const ids = Object.keys(partToLayer).filter((id) => partToLayer[id].interaction && map.getLayer(id) && map.getLayoutProperty(id, "visibility") !== "none");

        const f = ids.length ? map.queryRenderedFeatures(e.point, { layers: ids })[0] : null;

        if (f) runInteraction(partToLayer[f.layer.id], f, e.lngLat);

      });

      map.on("mousemove", (e) => {

        const ids = Object.keys(partToLayer).filter((id) => (partToLayer[id].interaction || partToLayer[id].hover) && map.getLayer(id) && map.getLayoutProperty(id, "visibility") !== "none");

        map.getCanvas().style.cursor = ids.length && map.queryRenderedFeatures(e.point, { layers: ids }).length ? "pointer" : "";

      });

      // hover tooltips / hover highlight

      CFG.layers.filter((l) => l.hover).forEach((l) => {

        const h = l.hover, pid = partId(l, h.part || 0);

        const pop = new maptilersdk.Popup({ closeButton: false, closeOnClick: false, className: h.className || "", offset: h.offset ?? 12 });

        hoverPopups.push(pop);

        let hid = null, timer;

        const clear = () => { if (hid !== null && h.state && map.getSource(l.id)) map.setFeatureState({ source: l.id, id: hid }, { hover: false }); hid = null; };

        map.on("mousemove", pid, (e) => {

          clearTimeout(timer); pop.remove();

          if (activePopup && activePopup.isOpen()) return clear();

          const f = e.features && e.features[0]; if (!f) return;

          if (h.state && hid !== f.id) { clear(); hid = f.id; map.setFeatureState({ source: l.id, id: hid }, { hover: true }); }

          const ll = [e.lngLat.lng, e.lngLat.lat];

          timer = setTimeout(() => {

            if (activePopup && activePopup.isOpen()) return;

            if (h.template) pop.setLngLat(ll).setHTML(tpl(h.template, f.properties)).addTo(map);

          }, h.delay ?? 0);

        });

        map.on("mouseleave", pid, () => { clearTimeout(timer); pop.remove(); clear(); });

      });

    }



    /* ---------------- Before/After photo viewer ---------------- */

    let dragging = false, compareBound = false, photoReq = 0;

    function setCmp(pct) {

      const c = Math.min(100, Math.max(0, pct));

      $("#cmp-before-wrap").style.width = c + "%"; $("#cmp-divider").style.left = c + "%"; $("#cmp-handle").style.left = c + "%";

    }

    function syncCmpSize() {

      const s = $("#photo-compare"); if (!s.classList.contains("loaded")) return;

      ["#cmp-after", "#cmp-before"].forEach((id) => { $(id).style.width = s.clientWidth + "px"; $(id).style.height = s.clientHeight + "px"; });

    }

    function bindCompare() {

      if (compareBound) return; compareBound = true;

      const s = $("#photo-compare");

      const pct = (x) => { const r = s.getBoundingClientRect(); return ((x - r.left) / r.width) * 100; };

      const cx = (e) => (e.touches ? e.touches[0].clientX : e.clientX);

      const start = (e) => { if (!s.classList.contains("loaded")) return; dragging = true; setCmp(pct(cx(e))); e.preventDefault(); };

      s.addEventListener("mousedown", start); s.addEventListener("touchstart", start, { passive: false });

      addEventListener("mousemove", (e) => dragging && setCmp(pct(cx(e))));

      addEventListener("touchmove", (e) => dragging && setCmp(pct(cx(e))), { passive: false });

      addEventListener("mouseup", () => (dragging = false)); addEventListener("touchend", () => (dragging = false));

      addEventListener("resize", () => $("#photo-modal").classList.contains("open") && syncCmpSize());

    }

    async function openCompare(inter, p) {

      bindCompare();

      const modal = $("#photo-modal"), slider = $("#photo-compare"), req = ++photoReq;

      const after = p[inter.imageField || "image"];

      const [from, to] = inter.beforeReplace || ["_post", "_pre"];

      const before = String(after || "").replace(from, to);

      slider.classList.remove("loaded"); setCmp(50);

      $("#cmp-after").removeAttribute("src"); $("#cmp-before").removeAttribute("src");

      $("#photo-modal-title").textContent = p[inter.titleField || "title"] || ""; $("#photo-modal-meta").textContent = "";

      modal.classList.add("open"); $("#photo-modal-close").focus();

      try {

        await Promise.all([loadImg(after), loadImg(before)]);

        if (req !== photoReq || !modal.classList.contains("open")) return;

        $("#cmp-after").src = after; $("#cmp-before").src = before;

        slider.classList.add("loaded"); requestAnimationFrame(syncCmpSize);

      } catch (e) { if (req === photoReq) $("#photo-modal-meta").textContent = "Before/after imagery could not be loaded."; }

    }

    function closeCompare() { photoReq++; dragging = false; $("#photo-modal").classList.remove("open"); }



    /* ---------------- Ground video viewer ---------------- */

    function platform(u) {

      u = String(u).toLowerCase();

      if (u.includes("youtu")) return "youtube";

      if (u.includes("facebook.com") || u.includes("fb.watch")) return "facebook";

      if (u.includes("tiktok.com")) return "tiktok";

      if (u.includes("x.com") || u.includes("twitter.com")) return "twitter";

      return "other";

    }

    function ytId(u) { const m = String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/); return m ? m[1] : null; }

    function xId(u) { const m = String(u).match(/(?:twitter\.com|x\.com)\/[^/]+\/status\/(\d+)/); return m ? m[1] : null; }



    function openVideo(inter, p) {

      const prev = $("#video-modal-preview"), box = $("#video-modal-links");

      $("#video-modal-title").textContent = p[inter.titleField || "title"] || "Ground Video";

      prev.innerHTML = ""; prev.classList.remove("visible"); box.innerHTML = "";

      let links = p[inter.linksField || "links"];

      if (typeof links === "string") { try { links = JSON.parse(links); } catch (_) { links = []; } }

      if (!Array.isArray(links)) links = [];

      const by = (t) => links.find((i) => platform(i.url) === t);

      const yt = by("youtube"), fb = by("facebook"), x = by("twitter"), tk = by("tiktok");



      if (yt && ytId(yt.url)) {

        prev.classList.add("visible");

        prev.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId(yt.url)}?rel=0" title="Video preview" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;

      } else if (fb) {

        prev.classList.add("visible");

        prev.innerHTML = `<iframe src="https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(fb.url)}&show_text=0&width=640" style="border:none;overflow:hidden" scrolling="no" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>`;

      } else if (x && xId(x.url)) {

        prev.classList.add("visible");

        prev.innerHTML = `<div style="padding:12px;background:#000;height:100%;overflow:auto"><blockquote class="twitter-tweet" data-media-max-width="560"><a href="https://twitter.com/i/status/${xId(x.url)}"></a></blockquote></div>`;

        if (!window.twttr) { const s = document.createElement("script"); s.src = "https://platform.twitter.com/widgets.js"; s.async = true; s.onload = () => window.twttr && window.twttr.widgets.load(prev); document.body.appendChild(s); }

        else window.twttr.widgets && window.twttr.widgets.load(prev);

      } else if (tk) {

        prev.classList.add("visible");

        prev.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#ccc;font-size:14px;text-align:center;padding:16px">TikTok cannot be embedded here.<br/>Use the button below to open the video.</div>`;

      }

      links.forEach((i) => {

        const pf = platform(i.url), a = document.createElement("a");

        a.href = i.url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.className = pf;

        a.textContent = "▶ " + (i.label || "Open video");

        box.appendChild(a);

      });

      if (!links.length) box.innerHTML = "<p style='color:#666;font-size:13px'>No video links available.</p>";

      $("#video-modal").classList.add("open"); $("#video-modal-close").focus();

    }

    function closeVideo() { const p = $("#video-modal-preview"); p.innerHTML = ""; p.classList.remove("visible"); $("#video-modal").classList.remove("open"); }



    /* ---------------- Coordinate search in geocoder ---------------- */

    function parseCoords(text) {

      const m = String(text || "").match(/[-+]?\d*\.?\d+/g);

      if (!m || m.length < 2) return null;

      const a = Number(m[0]), b = Number(m[1]);

      if (!isFinite(a) || !isFinite(b) || Math.abs(a) > 180 || Math.abs(b) > 180) return null;

      if (Math.abs(a) <= 90 && Math.abs(b) > 90) return { lat: a, lng: b };

      if (Math.abs(b) <= 90 && Math.abs(a) > 90) return { lat: b, lng: a };

      if (Math.abs(a) <= 90 && Math.abs(b) <= 90) {

        const c = map.getCenter(), A = { lat: a, lng: b }, B = { lat: b, lng: a };

        return Math.abs(A.lat - c.lat) + Math.abs(A.lng - c.lng) <= Math.abs(B.lat - c.lat) + Math.abs(B.lng - c.lng) ? A : B;

      }

      return null;

    }

    function setupCoordinateSearch() {

      document.addEventListener("keydown", (e) => {

        if (e.key !== "Enter") return;

        const t = (e.composedPath && e.composedPath().find((x) => x instanceof HTMLInputElement && x.type === "text")) || document.activeElement;

        if (!(t instanceof HTMLInputElement) || !t.closest("[class*='geocod'], .maptiler-geocoding-control")) return;

        const c = parseCoords(t.value); if (!c) return;

        e.preventDefault(); e.stopPropagation();

        map.flyTo({ center: [c.lng, c.lat], zoom: 14, speed: 0.9, curve: 1.2 });

        if (jumpMarker) jumpMarker.remove();

        jumpMarker = new maptilersdk.Marker({ color: "#d62828" }).setLngLat([c.lng, c.lat]).addTo(map);

        t.blur();

      }, true);

    }



    /* ---------------- Init ---------------- */

    function resolveStyle(v) {

      if (/^https?:/i.test(v)) return v;

      return v.split(".").reduce((o, k) => (o ? o[k] : undefined), maptilersdk.MapStyle);

    }



    function init() {

      const a = CFG.app;

      document.title = a.title + " – Kathmandu Metropolitan City";

      maptilersdk.config.apiKey = a.apiKey;

      buildSidebar();

      const dataReady = Promise.all(CFG.layers.map(loadData));

      const base = CFG.basemaps.find((b) => b.id === a.defaultBasemap) || CFG.basemaps[0];



      map = new maptilersdk.Map({

        container: "map", style: resolveStyle(base.style), center: a.center, zoom: a.zoom, pitch: a.pitch ?? 0,

        terrain: !!a.terrain, terrainControl: true, fullscreenControl: "bottom-right", geolocateControl: true,

      });



      map.on("load", async () => {

        await dataReady;

        await addAll();

        bindInteractions();

        updateMasterCheckbox();

      });



      map.addControl(new maptilersdkMaptilerGeocoder.GeocodingControl({}), "top-right");

      map.addControl(new maptilersdk.ScaleControl({ maxWidth: 200, unit: "metric" }), "top-right");

      setupCoordinateSearch();



      // sidebar behaviour

      const sb = $("#sidebar"), tg = $("#sidebar-toggle");

      tg.addEventListener("click", () => { sb.classList.add("open"); tg.classList.add("hidden"); });

      $("#sidebar-close").addEventListener("click", () => { sb.classList.remove("open"); tg.classList.remove("hidden"); });

      sb.addEventListener("click", (e) => {

        e.stopPropagation();

        const z = e.target.closest(".zoom-to-layer-btn");

        if (z) { e.preventDefault(); zoomToSource(z.dataset.source); }

      });

      document.querySelectorAll(".layer-chk").forEach((c) => c.addEventListener("change", () => { syncVisibility(); updateMasterCheckbox(); }));

      const all = $("#all-layers");

      if (all) all.addEventListener("change", () => {

        document.querySelectorAll(".layer-chk").forEach((c) => (c.checked = all.checked));

        syncVisibility(); updateMasterCheckbox();

      });



      document.querySelectorAll('input[name="basemap"]').forEach((r) => r.addEventListener("change", () => {

        const b = CFG.basemaps.find((x) => x.id === r.value); if (!b) return;

        map.setStyle(resolveStyle(b.style));

        map.once("styledata", () => addAll());

      }));



      // modals

      $("#photo-modal-close").addEventListener("click", closeCompare);

      $("#photo-modal").addEventListener("click", (e) => e.target.id === "photo-modal" && closeCompare());

      $("#video-modal-close").addEventListener("click", closeVideo);

      $("#video-modal").addEventListener("click", (e) => e.target.id === "video-modal" && closeVideo());

      document.addEventListener("keydown", (e) => {

        if (e.key !== "Escape") return;

        if ($("#photo-modal").classList.contains("open")) closeCompare();

        if ($("#video-modal").classList.contains("open")) closeVideo();

      });

    }

  </script>
